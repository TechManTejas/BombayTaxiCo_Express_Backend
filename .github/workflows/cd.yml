name: CD

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Dockerfile presence
        id: dockerfile
        run: |
          if [ -f Dockerfile ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip image publish when Dockerfile is missing
        if: ${{ steps.dockerfile.outputs.exists != 'true' }}
        run: echo "Dockerfile not found. Skipping image build and publish."

      - name: Setup Docker Buildx
        if: ${{ steps.dockerfile.outputs.exists == 'true' }}
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: ${{ steps.dockerfile.outputs.exists == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        if: ${{ steps.dockerfile.outputs.exists == 'true' }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        if: ${{ steps.dockerfile.outputs.exists == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-over-ssh:
    runs-on: ubuntu-latest
    needs: build-and-publish-image
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - name: Check Dockerfile presence
        id: dockerfile
        run: |
          if [ -f Dockerfile ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip deploy when Dockerfile is missing
        if: ${{ steps.dockerfile.outputs.exists != 'true' }}
        run: echo "Dockerfile not found. Skipping deploy."

      - name: Skip deploy when SSH secrets are not configured
        if: ${{ steps.dockerfile.outputs.exists == 'true' && (secrets.DEPLOY_SSH_HOST == '' || secrets.DEPLOY_SSH_USER == '' || secrets.DEPLOY_SSH_PRIVATE_KEY == '') }}
        run: |
          echo "DEPLOY_SSH_HOST / DEPLOY_SSH_USER / DEPLOY_SSH_PRIVATE_KEY not configured."
          echo "Image was published, but server deploy step is intentionally skipped."

      - name: Deploy to server via SSH
        if: ${{ steps.dockerfile.outputs.exists == 'true' && secrets.DEPLOY_SSH_HOST != '' && secrets.DEPLOY_SSH_USER != '' && secrets.DEPLOY_SSH_PRIVATE_KEY != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_APP_PATH }}
            docker pull ghcr.io/${{ github.repository }}:latest
            docker compose up -d
            docker image prune -f
